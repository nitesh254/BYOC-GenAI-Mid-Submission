project:
  name: "DocuMind AI"
  version: "1.0.0-baseline"
  description: "Modular RAG-based Policy & Document Assistant using local open-source models"

paths:
  raw_data_dir: "data/raw/basecamp_policies"
  sample_pdf_dir: "data/sample"
  processed_dir: "data/processed"
  index_dir: "data/processed/faiss_index"
  eval_dataset_path: "data/eval/eval_questions.json"
  assets_dir: "assets"

ingestion:
  chunk_size_words: 180        # ~240 tokens baseline; tuned in Final Experiments (256/512/1024 tokens)
  chunk_overlap_words: 35
  min_chunk_words: 20

retrieval:
  embedding_model: "sentence-transformers/all-MiniLM-L6-v2"
  top_k: 4
  min_similarity_score: 0.35   # Cosine similarity threshold for out-of-scope refusal guard

llm:
  provider: "auto"             # "auto" (Ollama if running, else local HuggingFace), "ollama", or "huggingface"
  ollama:
    base_url: "http://localhost:11434"
    model: "qwen2.5:1.5b"
    temperature: 0.1
    timeout_seconds: 120
  huggingface:
    model_id: "Qwen/Qwen2.5-0.5B-Instruct"
    max_new_tokens: 220
    temperature: 0.1

evaluation:
  top_k_values: [1, 3, 5]
  refusal_phrase: "I could not find this information in the provided documents."
